<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeCA Gestión</title>
<style>
:root{--navy:#0f2233;--navy2:#1b3349;--grn:#0fa37f;--grnd:#0b7f62;--amb:#f5a524;--red:#d64545;--bg:#f1f4f7;--line:#dbe2e9;--mut:#5f7080;--ink:#13232f}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Bahnschrift","DIN Alternate","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#shell{display:flex;min-height:100vh}
aside{width:230px;flex:none;background:var(--navy);color:#fff;padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside b{font-size:19px;padding:0 10px 20px}aside b i{font-style:normal;color:var(--grn)}aside small{margin-top:auto;padding:10px;color:#7f93a4;font-size:11px}
nav{display:flex;flex-direction:column;gap:2px}nav button{background:none;color:#b6c4d0;border:0;border-left:3px solid transparent;text-align:left;padding:10px 12px;border-radius:6px;font:inherit;cursor:pointer}
nav button:hover{background:var(--navy2)}nav button.on{background:var(--navy2);color:#fff;border-left-color:var(--grn)}
main{flex:1;min-width:0;max-width:1120px;padding:28px}h2{margin:0 0 16px;font-size:23px}h3{margin:0 0 12px;font-size:15px;color:var(--grnd)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}.top h2{margin:0}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.st div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}.st strong{display:block;font-size:30px;line-height:1.1}.st span{color:var(--mut);font-size:12px}
.fl{display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start}.sum{position:sticky;top:16px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--grn)}.bar.w i{background:var(--red)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.e{margin-bottom:10px;padding:10px;border-left:3px solid var(--grn);background:#f6f8fa;border-radius:6px}
label{display:block;font-size:12px;color:var(--mut)}input,select{display:block;width:100%;margin-top:4px;padding:9px;border:1px solid #bccad5;border-radius:6px;font:inherit;color:var(--ink);background:#fff}
button{background:var(--grn);color:#fff;border:0;border-radius:6px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}button:hover{background:var(--grnd)}button.s{background:#fff;color:var(--grnd);border:1px solid var(--grn)}button.s:hover{background:#eefaf6}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--amb);outline-offset:1px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut);font-weight:600}
.a{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}.a button,.mn summary{padding:6px 10px;font-size:13px}.mut{color:var(--mut)}
.tag{padding:2px 9px;border-radius:9px;background:#d6f3ea;color:#0b5e49;font-size:12px;font-weight:600}.tag.x{background:#fde0e0;color:#8f2323}
.mn{position:relative}.mn summary{list-style:none;cursor:pointer;border:1px solid var(--grn);border-radius:6px;color:var(--grnd);font-weight:600}.mn summary::-webkit-details-marker{display:none}
.mn div{position:absolute;right:0;z-index:3;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:5px;min-width:150px;box-shadow:0 8px 24px #0f223333}
.err{display:none;margin-top:10px;padding:9px;border-radius:6px;background:#fde0e0;color:#8f2323}.err.ok{background:#d6f3ea;color:#0b5e49}
#m{position:fixed;inset:0;background:#0f2233aa;display:none;align-items:center;justify-content:center;padding:12px;z-index:9}#m>div{background:#fff;border-radius:10px;padding:16px;width:min(560px,100%);max-height:96vh;overflow:auto}
#m iframe{width:100%;height:70vh;border:1px solid var(--line)}#m img{width:min(520px,100%);image-rendering:pixelated;display:block;margin:auto}
#gate{width:min(340px,100%);margin:0;text-align:center}.sm{font-size:12px;word-break:break-all}
@media(max-width:980px){.fl{grid-template-columns:1fr}.sum{position:static}}
@media(max-width:820px){aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;padding:0;z-index:5}aside b,aside small{display:none}
nav{flex-direction:row;width:100%;overflow-x:auto}nav button{flex:1;white-space:nowrap;text-align:center;border-left:0;border-top:3px solid transparent;border-radius:0;padding:13px 10px;font-size:12px}nav button.on{border-top-color:var(--grn)}main{padding:16px 12px 84px}.mn div{right:auto;left:0}}

.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--navy);color:#fff;border-radius:14px;padding:22px 28px;margin-bottom:16px;overflow:hidden}.hero h2{color:#fff;margin:0 0 4px}.hero p{margin:0 0 16px;color:#b6c4d0}.hero .hs{width:min(350px,46%);flex:none}
.hs .tr{animation:bob .9s ease-in-out infinite}.hs .w{transform-box:fill-box;transform-origin:center;animation:spin .55s linear infinite}.hs .dash{animation:mv .7s linear infinite}
@keyframes bob{50%{transform:translateY(-1.5px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes mv{to{stroke-dashoffset:32}}@keyframes up{from{opacity:0;transform:translateY(10px)}}@keyframes pop{from{opacity:0;transform:scale(.96)}}
main>*{animation:up .45s both}main>*:nth-child(2){animation-delay:.07s}main>*:nth-child(3){animation-delay:.14s}main>*:nth-child(4){animation-delay:.21s}
#m>div{animation:pop .25s}button:active{transform:scale(.97)}tr.r:hover{background:#f4faf8}.bar i{transition:width .5s}.card{transition:box-shadow .2s}.card:hover{box-shadow:0 4px 18px #0f223314}
.mat{display:inline-flex;align-items:stretch;border:2px solid #13232f;border-radius:6px;background:#fff;overflow:hidden;font:700 15px/1 "Bahnschrift","DIN Alternate",monospace;letter-spacing:.09em;vertical-align:middle}
.mat i{background:#0b3d91;color:#fff;font:700 9px/1.1 system-ui;padding:3px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.mat i:before{content:"★";font-size:7px;color:#ffd43b}.mat b{padding:5px 9px}
.pl{display:flex;gap:10px;align-items:center}.ic{width:42px;height:24px;flex:none}
.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:8px;border-left:4px solid var(--grn);animation:up .3s;z-index:20}
#lg{min-height:100vh;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px}#lg .hs{width:min(400px,92%)}
@media(max-width:820px){.toast{bottom:78px}}@media(max-width:560px){.hero .hs{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<div id="app"></div><div id="m"><div id="mb"></div></div>
<script>
// ===== Capa de datos: hoy localStorage; mañana se sustituye por fetch() al backend/Postgres/n8n =====
const L=k=>JSON.parse(localStorage.getItem(k)||'null'),S=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),rows=k=>L(k)||[];
const CLAVE='Lasautt2026',NIF=/^[A-Z0-9][0-9]{7}[A-Z0-9]$/i,MAT=/^[A-Z0-9 -]{4,10}$/i;
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID(),fmt=s=>new Date(s).toLocaleString('es-ES');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VEH=[['matricula','Matrícula'],['tipo','Tipo'],['marca','Marca'],['modelo','Modelo'],['carga','Carga máx. (kg)','number']];
const ENT={conductores:{t:'Conductores',f:[['nombre','Nombre'],['telefono','Teléfono'],['email','Email']]},
camiones:{t:'Camiones',f:[...VEH,['remolqueId','Remolque habitual','remolques']]},remolques:{t:'Remolques',f:VEH},
terceros:{t:'Clientes y transportistas',f:[['nombre','Nombre'],['nif','NIF'],['domicilio','Domicilio']]}};
const lab=(k,o)=>!o?'':k==='conductores'?o.nombre:k==='terceros'?`${o.nombre} (${o.nif})`:`${o.matricula} · ${o.marca} ${o.modelo}`;
const opts=(k,sel)=>'<option value="">Selecciona…</option>'+rows(k).map(o=>`<option value="${o.id}"${o.id===sel?' selected':''}>${esc(lab(k,o))}</option>`).join('');
let tab='deca',edit=null;
const plate=m=>`<span class=mat><i>E</i><b>${esc(m)}</b></span>`;
const wh=x=>`<g transform="translate(${x} 88)"><g class=w><circle r=11 fill="#0b1620"/><circle r=4.5 fill="#8fa3b3"/><path d="M0-9v18M-9 0h18" stroke="#8fa3b3" stroke-width=2 /></g></g>`;
const HERO=`<svg class=hs viewBox="0 0 360 112" aria-hidden=true><line x1=0 y1=101 x2=360 y2=101 stroke="#2c4a63" stroke-width=2 /><line class=dash x1=0 y1=108 x2=360 y2=108 stroke="#4b6a84" stroke-width=2 stroke-dasharray="18 14"/><g class=tr><rect x=14 y=24 width=196 height=60 rx=5 fill="#fff"/><rect x=14 y=24 width=196 height=11 rx=5 fill="#0fa37f"/><rect x=14 y=70 width=196 height=5 fill="#dbe2e9"/><text x=112 y=58 text-anchor=middle font-size=15 font-weight=700 fill="#0f2233" font-family="Bahnschrift,Arial">DeCA</text><path d="M216 40h44l26 22v24h-70z" fill="#0fa37f"/><path d="M248 46h10l16 15h-26z" fill="#cfe9f5"/><rect x=216 y=80 width=70 height=6 fill="#0b7f62"/>${wh(52)}${wh(84)}${wh(236)}${wh(268)}</g></svg>`;
const ICO={camiones:'<svg class=ic viewBox="0 0 44 24"><path d="M5 6h15l9 8v5H5z" fill="#0fa37f"/><path d="M15 8h5l6 6H15z" fill="#cfe9f5"/><circle cx=12 cy=19 r=3.5 fill="#0b1620"/><circle cx=26 cy=19 r=3.5 fill="#0b1620"/></svg>',remolques:'<svg class=ic viewBox="0 0 44 24"><rect x=3 y=3 width=38 height=15 rx=2 fill="#1b3349"/><rect x=3 y=3 width=38 height=4 rx=2 fill="#0fa37f"/><circle cx=28 cy=19.5 r=3.5 fill="#0b1620"/><circle cx=36 cy=19.5 r=3.5 fill="#0b1620"/></svg>'};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
function cnt(){const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n;if(rm||!n){el.textContent=n;return}let s;const f=t=>{s??=t;const p=Math.min(1,(t-s)/700);el.textContent=Math.round(n*p*(2-p));p<1&&requestAnimationFrame(f)};requestAnimationFrame(f)})}

function showErr(t,ok){const e=$('#err');if(!e)return;e.textContent=t;e.className='err'+(ok?' ok':'');e.style.display='block'}
function go(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab||(tab==='new'&&b.dataset.t==='deca')));
$('#v').innerHTML=tab==='deca'?list():tab==='new'?dForm():tab==='empresa'?emp():crud(tab);if(tab==='new'){lbl();upd()}cnt()}
// ===== Empresa y datos maestros =====
function emp(){const e=L('empresa')||{};return `<h2>Mi empresa</h2><div class=card><div class=g>${[['nombre','Nombre'],['nif','NIF'],['domicilio','Domicilio']].map(([f,l])=>`<label>${l}<input id=e_${f} value="${esc(e[f])}"></label>`).join('')}</div><p><button onclick="saveEmp()">Guardar empresa</button></p><div class=err id=err></div></div>`}
function saveEmp(){const o={};for(const f of['nombre','nif','domicilio'])o[f]=$('#e_'+f).value.trim();
if(!o.nombre||!o.domicilio||!NIF.test(o.nif))return showErr('Completa nombre, domicilio y un NIF válido (ej. B12345678).');S('empresa',o);showErr('Empresa guardada.',1)}
function crud(k){const e=ENT[k],r=rows(k),c=r.find(x=>x.id===edit)||{};
return `<h2>${e.t}</h2><div class=card><div class=g>${e.f.map(([f,l,t])=>`<label>${l}${t&&t!=='number'?`<select id=f_${f}>${opts(t,c[f])}</select>`:`<input id=f_${f} type=${t||'text'} value="${esc(c[f])}">`}</label>`).join('')}</div>
<p><button onclick="saveE('${k}')">${edit?'Guardar cambios':'Añadir'}</button>${edit?` <button class=s onclick="edit=null;go()">Cancelar</button>`:''}</p><div class=err id=err></div></div>
<div class=card>${r.length?`<table><tr>${e.f.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr>${r.map(o=>`<tr>${e.f.map(([f,,t])=>`<td>${f==='matricula'?`<span class=pl>${ICO[k]||''}${plate(o[f])}</span>`:esc(t&&t!=='number'?lab(t,rows(t).find(x=>x.id===o[f])):o[f])}</td>`).join('')}<td class=a><button class=s onclick="edit='${o.id}';go()">Editar</button><button class=s onclick="delE('${k}','${o.id}')">Borrar</button></td></tr>`).join('')}</table>`:'<p class=mut>Aún no hay registros. Añade el primero arriba.</p>'}</div>`}
function saveE(k){const e=ENT[k],o={};for(const[f]of e.f)o[f]=$('#f_'+f).value.trim();
const opt=['remolqueId','telefono','email'];if(e.f.some(([f])=>!o[f]&&!opt.includes(f)))return showErr('Completa todos los campos obligatorios.');
if(k==='terceros'&&!NIF.test(o.nif))return showErr('NIF no válido.');if(o.matricula&&!MAT.test(o.matricula))return showErr('Matrícula no válida.');
if(o.carga!==undefined&&!(+o.carga>0))return showErr('La carga máxima debe ser mayor que 0.');
if(o.matricula)o.matricula=o.matricula.toUpperCase();const r=rows(k);
if(edit)Object.assign(r.find(x=>x.id===edit),o);else r.push({id:uid(),...o});S(k,r);toast('Guardado');edit=null;go()}
function delE(k,id){if(!confirm('¿Borrar este registro? Los DeCA ya emitidos no cambian.'))return;S(k,rows(k).filter(x=>x.id!==id));go()}
function seed(){S('empresa',{nombre:'Transportes Duero S.L.',nif:'B87654321',domicilio:'C/ Mayor 1, 37001 Salamanca'});
S('conductores',[{id:uid(),nombre:'Luis Prieto',telefono:'600111222',email:'luis@duero.es'},{id:uid(),nombre:'Marta Gil',telefono:'600333444',email:'marta@duero.es'}]);
const r=[{id:uid(),matricula:'R1234BCD',tipo:'Lona',marca:'Schmitz',modelo:'SCS',carga:26000},{id:uid(),matricula:'R5678DFG',tipo:'Frigorífico',marca:'Krone',modelo:'Cool Liner',carga:24000}];S('remolques',r);
S('camiones',[{id:uid(),matricula:'1234ABC',tipo:'Tractora',marca:'Volvo',modelo:'FH 460',carga:40000,remolqueId:r[0].id},{id:uid(),matricula:'5678DEF',tipo:'Tractora',marca:'Scania',modelo:'R450',carga:40000,remolqueId:r[1].id}]);
S('terceros',[{id:uid(),nombre:'Cerámicas Norte S.L.',nif:'B12345678',domicilio:'Pol. Ind. 4, 37008 Salamanca'},{id:uid(),nombre:'Obras Castilla S.A.',nif:'A11223344',domicilio:'Av. Toledo 22, 45001 Toledo'}]);go()}
// ===== DeCA: formulario con desplegables =====
const envRow=(e={})=>`<div class="g e"><label>Origen<input class=o value="${esc(e.origen)}"></label><label>Destino<input class=d value="${esc(e.destino)}"></label><label>Mercancía<input class=n value="${esc(e.naturaleza)}"></label><label>Peso (kg)<input class=p type=number value="${esc(e.pesoKg)}"></label></div>`;
const addEnv=()=>{$('#env').insertAdjacentHTML('beforeend',envRow());upd()};
function lbl(){$('#tl').textContent=$('#rol').value==='CARGADOR_CONTRACTUAL'?'Transportista efectivo (la otra parte)':'Cargador contractual (la otra parte)'}
function autoRem(){const c=rows('camiones').find(o=>o.id===$('#cam').value);if(c?.remolqueId)$('#rem').value=c.remolqueId}
function upd(){if(!$('#sm'))return;const c=rows('camiones').find(o=>o.id===$('#cam')?.value),t=[...document.querySelectorAll('.e .p')].reduce((s,i)=>s+(+i.value||0),0),n=document.querySelectorAll('.e').length,w=c&&t>+c.carga,pc=c?Math.min(100,t/c.carga*100):0;
$('#sm').innerHTML=`<p>${n} envío${n>1?'s':''} · <b>${t.toLocaleString('es-ES')} kg</b></p>`+(c?`<div class="bar${w?' w':''}"><i style="width:${pc}%"></i></div><p class=mut>Carga máxima del camión: ${(+c.carga).toLocaleString('es-ES')} kg</p>${w?'<p style="color:var(--red)"><b>El peso supera la carga máxima del camión.</b></p>':''}`:'<p class=mut>Elige un camión para comparar la carga.</p>')}
function dForm(){const d=rows('decas').find(x=>x.id===edit),i=d?.ids||{},x=d?.data||{};
return `<h2>${d?'Modificar '+d.numero:'Nuevo DeCA'}</h2><div class=fl oninput=upd() onchange=upd()><div>
<div class=card><h3>Las partes</h3><div class=g><label>Mi empresa actúa como<select id=rol onchange=lbl()><option value=TRANSPORTISTA_EFECTIVO>Transportista efectivo</option><option value=CARGADOR_CONTRACTUAL${x.rol==='CARGADOR_CONTRACTUAL'?' selected':''}>Cargador contractual</option></select></label>
<label><span id=tl></span><select id=ter>${opts('terceros',i.ter)}</select></label><label>Fecha de transporte<input id=fec type=date value="${esc(x.fecha)}"></label></div></div>
<div class=card><h3>Vehículo y conductor</h3><div class=g><label>Camión<select id=cam onchange=autoRem()>${opts('camiones',i.cam)}</select></label><label>Remolque<select id=rem>${opts('remolques',i.rem)}</select></label>
<label>Conductor<select id=con>${opts('conductores',i.con)}</select></label><label>Autorización especial (opcional)<input id=aut value="${esc(x.aut)}"></label></div></div>
<div class=card><h3>Envíos</h3><div id=env>${(x.envios||[{}]).map(envRow).join('')}</div><button class=s onclick="addEnv()">Añadir otro envío</button><label style="margin-top:12px">Observaciones (opcional)<input id=obs value="${esc(x.obs)}"></label></div>
${d?`<div class=card><h3>Datos del cambio</h3><div class=g><label>Método<select id=met><option value=NUEVO_PDF>B · PDF nuevo con QR nuevo (el original se conserva)</option><option value=MISMO_PDF>A · Mismo PDF y QR (la versión anterior se guarda)</option></select></label><label>Motivo del cambio<input id=mot></label></div></div>`:''}
</div><div class="card sum"><h3>Resumen</h3><div id=sm></div><div class=err id=err></div><p><button onclick="saveD()">${d?'Aplicar modificación':'Generar DeCA'}</button> <button class=s onclick="edit=null;tab='deca';go()">Cancelar</button></p></div></div>`}
function saveD(){const emp=L('empresa'),g=id=>$('#'+id).value,pk=(k,id)=>rows(k).find(o=>o.id===g(id));
const ter=pk('terceros','ter'),cam=pk('camiones','cam'),rem=pk('remolques','rem'),con=pk('conductores','con');
const env=[...document.querySelectorAll('.e')].map(e=>({origen:e.querySelector('.o').value.trim(),destino:e.querySelector('.d').value.trim(),naturaleza:e.querySelector('.n').value.trim(),pesoKg:+e.querySelector('.p').value}));
const er=[];if(!emp)er.push('Configura primero los datos de tu empresa.');if(!ter)er.push('Selecciona la otra parte del contrato.');if(!cam)er.push('Selecciona un camión.');if(!con)er.push('Selecciona un conductor.');if(!g('fec'))er.push('Indica la fecha.');
if(env.some(e=>!e.origen||!e.destino||!e.naturaleza||!(e.pesoKg>0)))er.push('Completa origen, destino, mercancía y peso (mayor que 0) en cada envío.');
if(edit&&!g('mot').trim())er.push('El motivo del cambio es obligatorio.');if(er.length)return showErr(er.join(' '));
const own={nombre:emp.nombre,nif:emp.nif,domicilio:emp.domicilio},rol=g('rol'),o2={nombre:ter.nombre,nif:ter.nif,domicilio:ter.domicilio},
data={rol,cargador:rol==='CARGADOR_CONTRACTUAL'?own:o2,transportista:rol==='TRANSPORTISTA_EFECTIVO'?own:o2,fecha:g('fec'),matricula:cam.matricula,remolque:rem?.matricula||'',conductor:con.nombre,aut:g('aut').trim(),obs:g('obs').trim(),envios:env},
ids={ter:ter.id,cam:cam.id,rem:rem?.id||'',con:con.id},ds=rows('decas'),now=new Date().toISOString();
const mk=(x={})=>({id:uid(),numero:`DECA-${new Date().getFullYear()}-${String(ds.length+1).padStart(4,'0')}`,estado:'VIGENTE',createdAt:now,modifiedAt:now,data,ids,versiones:[],...x});
if(!edit)ds.push(mk());else{const d=ds.find(x=>x.id===edit);
if(g('met')==='MISMO_PDF'){d.versiones.push({fecha:now,motivo:g('mot').trim(),data:d.data});d.data=data;d.ids=ids;d.modifiedAt=now}
else{const n=mk({sustituyeA:{id:d.id,numero:d.numero},motivo:g('mot').trim()});d.estado='SUSTITUIDO';d.sustituidoPor={id:n.id,numero:n.numero};d.modifiedAt=now;ds.push(n)}}
S('decas',ds);toast(edit?'Modificación aplicada':ds[ds.length-1].numero+' generado');edit=null;tab='deca';go()}

// ===== QR y enlace autocontenido (en producción será /d/:token del backend) =====
const b64=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const zip=async(s,c)=>new Uint8Array(await new Response(new Blob([s]).stream().pipeThrough(new(c?CompressionStream:DecompressionStream)('deflate-raw'))).arrayBuffer());
const link=async d=>location.href.split('#')[0]+'#d='+b64(await zip(JSON.stringify({...d,ids:0}),1));
const unlink=async s=>JSON.parse(new TextDecoder().decode(await zip(Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)),0)));
function qrPng(u,px=5){const q=qrcode(0,'L');q.addData(u);q.make();const n=q.getModuleCount(),c=document.createElement('canvas'),t=c.getContext('2d');c.width=c.height=(n+4)*px;t.fillStyle='#fff';t.fillRect(0,0,c.width,c.height);t.fillStyle='#000';
for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))t.fillRect((k+2)*px,(r+2)*px,px,px);return c.toDataURL('image/png')}
const modal=h=>{$('#mb').innerHTML=h;$('#m').style.display='flex'},closeM=()=>$('#m').style.display='none';

window._u=u;modal(`<h2>${d.numero}</h2><img src="${img}" alt="QR del DeCA">${location.protocol==='file:'?'<p class=err style="display:block">Has abierto el archivo desde tu ordenador: el móvil no podrá abrir este QR. Sube el index.html a EasyPanel y genera el DeCA desde esa dirección.</p>':''}<p class="sm mut">Al escanearlo se abre el PDF. En la demo el enlace lleva los datos dentro; con backend será una URL corta.</p><p><button onclick="navigator.clipboard.writeText(_u)">Copiar enlace</button> <button class=s onclick="window.open(_u)">Abrir enlace</button> <button class=s onclick=closeM()>Cerrar</button></p>`)}

const fv=(k,x)=>k==='envios'?x.envios.map(e=>`${e.origen}-${e.destino} ${e.naturaleza} ${e.pesoKg}kg`).join(' | '):(k==='cargador'||k==='transportista')?`${x[k].nombre} ${x[k].nif}`:x[k]||'(vacío)';
function pdf(d,vi,url){const old=vi!=null,x=old?d.versiones[vi].data:d.data,doc=new jspdf.jsPDF({unit:'mm',format:'a4'});let y=18;
doc.setProperties({title:'DeCA '+d.numero,subject:'Documento electrónico de control administrativo',creator:'DeCA Gestión (demo)'});doc.setCreationDate(new Date(d.createdAt));
const T=(s,sz=10,b=0,c=[20,35,43],st=0)=>{doc.setFont('helvetica',b?'bold':'normal').setFontSize(sz).setTextColor(...c);
for(const l of doc.splitTextToSize(String(s),y<92?128:182)){doc.text(l,15,y);if(st)doc.line(15,y-1.3,15+doc.getTextWidth(l),y-1.3);y+=sz*.42+1.4}};
const S=t=>{y+=2;T(t,11,1,[11,127,98])};const P=(m,xx,yy)=>{doc.setDrawColor(19,35,47).setLineWidth(.4).setFillColor(255,255,255).roundedRect(xx,yy,34,9,1.5,1.5,'FD');doc.setFillColor(11,61,145).roundedRect(xx,yy,6,9,1.5,1.5,'F');doc.setFont('helvetica','bold').setFontSize(6).setTextColor(255,255,255).text('E',xx+3,yy+7.4,{align:'center'});doc.setFontSize(12).setTextColor(19,35,47).text(m,xx+21,yy+6.7,{align:'center'});doc.setLineWidth(.2)};
doc.setFillColor(15,34,51).rect(0,0,210,32,'F');doc.setFont('helvetica','bold').setFontSize(13).setTextColor(255,255,255).text('DOCUMENTO ELECTRÓNICO DE CONTROL ADMINISTRATIVO',15,14);
doc.setFontSize(10).setTextColor(245,165,36).text(`Nº ${d.numero}  ·  Versión ${old?vi+1+' (anterior, no vigente)':d.versiones.length+1}`,15,23);y=41;
T('Creado: '+fmt(d.createdAt));T('Última modificación: '+fmt(d.modifiedAt));
if(d.estado==='SUSTITUIDO')T(`DOCUMENTO SUSTITUIDO, NO VÁLIDO. Ver ${d.sustituidoPor.numero}.`,10,1,[214,69,69]);
if(d.sustituyeA)T(`Sustituye a ${d.sustituyeA.numero}. Motivo: ${d.motivo}`);
doc.setDrawColor(219,226,233).rect(148,37,49,54);doc.addImage(qrPng(url,4),'PNG',150,39,45,45);doc.setFont('helvetica','normal').setFontSize(7).setTextColor(95,112,128).text('Escanee para obtener el documento',151,88);
S('Cargador contractual');T(`${x.cargador.nombre}  ·  NIF ${x.cargador.nif}`);T('Domicilio: '+x.cargador.domicilio);
S('Transportista efectivo');T(`${x.transportista.nombre}  ·  NIF ${x.transportista.nif}`);
S('Transporte');T('Fecha de realización: '+x.fecha);T('Vehículo'+(x.remolque?' y remolque':'')+':');P(x.matricula,15,y-2);if(x.remolque)P(x.remolque,54,y-2);y+=10;T('Conductor: '+x.conductor);if(x.aut)T('Autorización especial de circulación: '+x.aut);
S(x.envios.length>1?'Envíos (el orden no implica orden de ejecución)':'Envío');y+=1;doc.setFillColor(232,238,243).rect(15,y-4.2,180,6.2,'F');doc.setFont('helvetica','bold').setFontSize(9).setTextColor(20,35,43);[['Origen',17],['Destino',66],['Mercancía',113],['Peso (kg)',172]].forEach(([t,xx])=>doc.text(t,xx,y));y+=6;
x.envios.forEach(e=>{doc.setFont('helvetica','normal').setFontSize(9);const ls=[[e.origen,17,45],[e.destino,66,43],[e.naturaleza,113,55],[String(e.pesoKg),172,20]].map(([t,xx,w])=>[doc.splitTextToSize(t,w),xx]),n=Math.max(...ls.map(a=>a[0].length));ls.forEach(([l,xx])=>doc.text(l,xx,y));y+=n*4+1;doc.setDrawColor(219,226,233).line(15,y-2.6,195,y-2.6);y+=2});
T('Peso total: '+x.envios.reduce((s,e)=>s+e.pesoKg,0)+' kg',9,1);
if(x.obs){S('Observaciones');T(x.obs)}
if(!old&&d.versiones.length){S('Historial de modificaciones');d.versiones.forEach((v,i)=>{const nx=i+1<d.versiones.length?d.versiones[i+1].data:d.data;
T(`${fmt(v.fecha)}  ·  Motivo: ${v.motivo}`,10,1);Object.keys(FL).filter(k=>fv(k,v.data)!==fv(k,nx)).forEach(k=>{T(`${FL[k]} anterior (YA NO VÁLIDO): ${fv(k,v.data)}`,9,0,[179,38,30],1)})})}
doc.setFontSize(7).setTextColor(100).text('Versión de demostración. No sustituye la validación normativa.',15,288);return doc}
